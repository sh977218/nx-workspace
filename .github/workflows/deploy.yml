name: Deploy To Render
on:
  workflow_dispatch:
    inputs:
      deploy-to-ui:
        type: boolean
        description: 'Deploy UI?'
        default: true
      deploy-to-api:
        type: boolean
        description: 'Deploy API?'
        default: true
      deploy-to-auth-ui:
        type: boolean
        description: 'Deploy Auth UI?'
        default: false
      deploy-to-auth-api:
        type: boolean
        description: 'Deploy Auth API?'
        default: false
      deploy-to-storybook:
        type: boolean
        description: 'Deploy Storybook?'
        default: true
jobs:
  deploy-ui-to-render:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy-to-ui == 'true'}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy
        run: |
          curl ${{ secrets.RENDER_DEPLOYMENT_HOOK_UI }}

  deploy-api-to-render:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy-to-api == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy
        run: |
          curl ${{ secrets.RENDER_DEPLOYMENT_HOOK_API }}

  deploy-auth-api-to-render:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy-to-auth-api == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy
        run: |
          curl ${{ secrets.RENDER_DEPLOYMENT_HOOK_AUTH_API }}

  deploy-auth-ui-to-render:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy-to-auth-ui == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy
        run: |
          curl ${{ secrets.RENDER_DEPLOYMENT_HOOK_AUTH_UI }}

  deploy-story-to-render:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy-to-storybook == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy
        run: |
          curl ${{ secrets.RENDER_DEPLOYMENT_HOOK_STORYBOOK }}
