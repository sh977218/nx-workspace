version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '03:00'
    open-pull-requests-limit: 100
    reviewers:
      - 'sh977218'
    assignees:
      - 'sh977218'
    allow:
      - dependency-type: 'all'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '04:00'
    open-pull-requests-limit: 100
    reviewers:
      - 'sh977218'
    assignees:
      - 'sh977218'
    commit-message:
      prefix: 'chore'
      include: 'scope'
